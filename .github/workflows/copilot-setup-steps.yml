name: Copilot Setup Secret Boundary Canary

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Fixed non-disclosing protected-secret boundary check
        shell: bash
        env:
          GHBB_TOKEN_A: >-
            ${{ secrets[format('{0}{1}{2}', 'GITHUB_', 'COPILOT_', 'GITHUB_TOKEN')] }}
          GHBB_TOKEN_B: >-
            ${{ secrets[format('{0}{1}{2}', 'GITHUB_', 'COPILOT_', 'GIT_TOKEN')] }}
          GHBB_TOKEN_C: >-
            ${{ secrets[format('{0}{1}{2}', 'GITHUB_', 'COPILOT_', 'API_TOKEN')] }}
        run: |
          set -euo pipefail
          target='https://api.github.com/repos/singetu0096/copilot-oidc-loopback-canary-20261105'

          present() {
            if [ -n "$1" ]; then printf 'true'; else printf 'false'; fi
          }

          owned_private_repo_status() {
            if [ -z "$1" ]; then
              printf 'not_attempted'
              return
            fi
            status="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' --max-time 10 \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $1" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --user-agent 'singetu0096-owned-copilot-secret-boundary/1.0' \
              "$target" || true)"
            case "$status" in
              [0-9][0-9][0-9]) printf '%s' "$status" ;;
              *) printf 'transport_error' ;;
            esac
          }

          a_present="$(present "$GHBB_TOKEN_A")"
          b_present="$(present "$GHBB_TOKEN_B")"
          c_present="$(present "$GHBB_TOKEN_C")"
          a_status="$(owned_private_repo_status "$GHBB_TOKEN_A")"
          b_status="$(owned_private_repo_status "$GHBB_TOKEN_B")"
          unset GHBB_TOKEN_A GHBB_TOKEN_B GHBB_TOKEN_C
          printf 'GHBB_SETUP_SECRET_BOUNDARY_V1 token_a_present=%s token_b_present=%s token_c_present=%s token_a_owned_private_repo_http=%s token_b_owned_private_repo_http=%s\n' \
            "$a_present" "$b_present" "$c_present" "$a_status" "$b_status"
