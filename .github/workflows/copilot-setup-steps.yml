name: Hidden GHAS Settings Context Canary

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Extract bounded static contexts for caller-controlled settings
        shell: bash
        run: |
          set -euo pipefail
          node <<'GHBB_NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const needles = [
            ['setting_warning', 'does not exist and will be ignored'],
            ['cross_repo', 'enableCrossRepoContext'],
            ['plugin_build', 'reviewPluginBuild'],
            ['detector_launch', 'Running detector:'],
          ];
          const root = process.env.RUNNER_TEMP;
          const maximumFiles = 6000;
          const maximumMapBytes = 50 * 1024 * 1024;
          const maximumContextBytesEach = 5000;
          const maximumPayloadBytes = 26000;
          let visited = 0;
          const files = [];

          const walk = (directory, depth) => {
            if (depth > 10 || visited >= maximumFiles) return;
            let entries = [];
            try {
              entries = fs.readdirSync(directory, {withFileTypes: true});
            } catch (_) {
              return;
            }
            for (const entry of entries) {
              if (visited >= maximumFiles) return;
              const candidate = path.join(directory, entry.name);
              visited += 1;
              if (entry.isDirectory()) walk(candidate, depth + 1);
              else if (entry.isFile() && (entry.name === 'autofind.js.map' || entry.name === 'autofind.js')) files.push(candidate);
            }
          };
          walk(root, 0);

          const mapSources = [];
          for (const candidate of files.filter((item) => item.endsWith('.map'))) {
            let stat;
            try { stat = fs.statSync(candidate); } catch (_) { continue; }
            if (stat.size <= 0 || stat.size > maximumMapBytes) continue;
            let map;
            try { map = JSON.parse(fs.readFileSync(candidate, 'utf8')); } catch (_) { continue; }
            if (!Array.isArray(map.sources) || !Array.isArray(map.sourcesContent)) continue;
            for (let index = 0; index < map.sourcesContent.length; index += 1) {
              if (typeof map.sourcesContent[index] !== 'string') continue;
              mapSources.push({
                path: String(map.sources[index] || '').slice(0, 500),
                source: map.sourcesContent[index],
                sourceMap: true,
              });
            }
          }
          const staticSources = [];
          for (const candidate of files.filter((item) => item.endsWith('autofind.js'))) {
            try {
              staticSources.push({
                path: path.basename(candidate),
                source: fs.readFileSync(candidate, 'utf8'),
                sourceMap: false,
              });
            } catch (_) {}
          }

          const contexts = [];
          for (const [label, needle] of needles) {
            let match = null;
            for (const candidate of [...mapSources, ...staticSources]) {
              const offset = candidate.source.indexOf(needle);
              if (offset < 0) continue;
              const start = Math.max(0, offset - 2400);
              const end = Math.min(candidate.source.length, offset + needle.length + 2400);
              const raw = Buffer.from(candidate.source.slice(start, end), 'utf8');
              match = {
                label,
                needleFound: true,
                sourceMap: candidate.sourceMap,
                sourcePath: candidate.path,
                context: raw.subarray(0, maximumContextBytesEach).toString('utf8'),
              };
              break;
            }
            contexts.push(match || {
              label,
              needleFound: false,
              sourceMap: false,
              sourcePath: '',
              context: '',
            });
          }

          const payload = Buffer.from(JSON.stringify({visited, contexts}), 'utf8');
          if (payload.length > maximumPayloadBytes) {
            throw new Error('bounded settings-context payload exceeded limit');
          }
          console.log(
            'GHBB_HIDDEN_GHAS_SETTINGS_CONTEXT_V1' +
            ` payload_b64=${payload.toString('base64url')}`
          );
          GHBB_NODE
