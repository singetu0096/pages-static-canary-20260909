name: Hidden GHAS Detector Source Boundary Canary

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Extract bounded static context for detector resolution
        shell: bash
        run: |
          set -euo pipefail
          node <<'GHBB_NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const needle = 'No detectors resolved for code scanning input';
          const root = process.env.RUNNER_TEMP;
          const maximumFiles = 6000;
          const maximumMapBytes = 50 * 1024 * 1024;
          const maximumContextBytes = 8000;
          let visited = 0;
          let sourceMapFound = false;
          let sourcePath = '';
          let context = '';

          const files = [];
          const walk = (directory, depth) => {
            if (depth > 10 || visited >= maximumFiles) return;
            let entries = [];
            try {
              entries = fs.readdirSync(directory, {withFileTypes: true});
            } catch (_) {
              return;
            }
            for (const entry of entries) {
              if (visited >= maximumFiles) return;
              const candidate = path.join(directory, entry.name);
              visited += 1;
              if (entry.isDirectory()) walk(candidate, depth + 1);
              else if (entry.isFile() && (entry.name === 'autofind.js.map' || entry.name === 'autofind.js')) files.push(candidate);
            }
          };
          walk(root, 0);

          for (const candidate of files.filter((item) => item.endsWith('.map'))) {
            let stat;
            try { stat = fs.statSync(candidate); } catch (_) { continue; }
            if (stat.size <= 0 || stat.size > maximumMapBytes) continue;
            let map;
            try { map = JSON.parse(fs.readFileSync(candidate, 'utf8')); } catch (_) { continue; }
            if (!Array.isArray(map.sources) || !Array.isArray(map.sourcesContent)) continue;
            for (let index = 0; index < map.sourcesContent.length; index += 1) {
              const source = map.sourcesContent[index];
              if (typeof source !== 'string') continue;
              const offset = source.indexOf(needle);
              if (offset < 0) continue;
              sourceMapFound = true;
              sourcePath = String(map.sources[index] || '').slice(0, 500);
              const start = Math.max(0, offset - 3500);
              const end = Math.min(source.length, offset + needle.length + 3500);
              context = source.slice(start, end);
              break;
            }
            if (context) break;
          }

          if (!context) {
            for (const candidate of files.filter((item) => item.endsWith('autofind.js'))) {
              let source = '';
              try { source = fs.readFileSync(candidate, 'utf8'); } catch (_) { continue; }
              const offset = source.indexOf(needle);
              if (offset < 0) continue;
              sourcePath = path.basename(candidate);
              const start = Math.max(0, offset - 3500);
              const end = Math.min(source.length, offset + needle.length + 3500);
              context = source.slice(start, end);
              break;
            }
          }

          const bounded = Buffer.from(context, 'utf8').subarray(0, maximumContextBytes);
          const encode = (value) => Buffer.from(value, 'utf8').toString('base64url');
          console.log(
            'GHBB_HIDDEN_GHAS_DETECTOR_SOURCE_V1' +
            ` source_map_found=${String(sourceMapFound)}` +
            ` needle_found=${String(context.includes(needle))}` +
            ` visited_count=${visited}` +
            ` source_path_b64=${encode(sourcePath) || '-'}` +
            ` context_b64=${bounded.length ? bounded.toString('base64url') : '-'}`
          );
          GHBB_NODE
