name: Copilot Setup OIDC Reader Reachability Canary

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Fixed backend OIDC Reader reachability check
        shell: bash
        env:
          GHBB_API_TOKEN: >-
            ${{ secrets[format('{0}{1}{2}', 'GITHUB_', 'COPILOT_', 'API_TOKEN')] }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          callback = "https://api.individual.githubcopilot.com/agents/swe/agent"
          token = os.environ.get("GHBB_API_TOKEN", "")
          event_path = os.environ.get("GITHUB_EVENT_PATH", "")

          job_id = ""
          nonce = ""
          try:
              with open(event_path, "r", encoding="utf-8") as handle:
                  event = json.load(handle)
              agent_inputs = json.loads(event.get("inputs", {}).get("COPILOT_AGENT_INPUTS", "{}"))
              job_id = str(agent_inputs.get("COPILOT_AGENT_JOB_ID", ""))
              nonce = str(agent_inputs.get("COPILOT_JOB_NONCE", ""))
          except (OSError, TypeError, ValueError, json.JSONDecodeError):
              pass

          api_token_present = bool(token)
          nonce_present = bool(nonce)
          job_id_valid = bool(re.fullmatch(
              r"168708449-1361558563-[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}",
              job_id,
          ))
          tokens_http = "not_attempted"
          failure_code = "none"
          returned_token_count = 0
          body_truncated = False

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          if api_token_present and nonce_present and job_id_valid:
              payload = json.dumps({
                  "mcp_server_names": ["ghbb-reader-oidc"],
                  "agent_name": "setup-oidc-reader-config",
              }, separators=(",", ":")).encode("utf-8")
              request = urllib.request.Request(
                  f"{callback}/jobs/{job_id}/tokens",
                  data=payload,
                  method="POST",
                  headers={
                      "Accept": "application/json",
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "singetu0096-owned-copilot-oidc-reader/1.0",
                      "X-GitHub-Job-Nonce": nonce,
                  },
              )
              raw = b""
              try:
                  with urllib.request.build_opener(NoRedirect).open(request, timeout=25) as response:
                      tokens_http = str(response.status)
                      raw = response.read(65537)
              except urllib.error.HTTPError as error:
                  tokens_http = str(error.code)
                  raw = error.read(65537)
                  error.close()
              except (urllib.error.URLError, TimeoutError, OSError):
                  tokens_http = "transport_error"

              if len(raw) > 65536:
                  body_truncated = True
                  raw = b""
              if raw:
                  try:
                      value = json.loads(raw)
                  except (TypeError, ValueError, json.JSONDecodeError):
                      value = None
                  if isinstance(value, dict):
                      failures = value.get("failures")
                      codes = []
                      if isinstance(failures, list):
                          for item in failures:
                              if isinstance(item, dict) and isinstance(item.get("response_code"), int):
                                  codes.append(item["response_code"])
                      if len(codes) == 1:
                          failure_code = str(codes[0])
                      elif len(codes) > 1:
                          failure_code = "multiple"
                      for key in ("secret_tokens", "mcp_server_tokens"):
                          tokens = value.get(key)
                          if isinstance(tokens, dict):
                              returned_token_count += sum(
                                  1 for item in tokens.values() if isinstance(item, str) and item
                              )

          token = nonce = job_id = ""
          print(
              "GHBB_SETUP_OIDC_READER_V1 "
              f"api_token_present={str(api_token_present).lower()} "
              f"job_id_valid={str(job_id_valid).lower()} "
              f"nonce_present={str(nonce_present).lower()} "
              f"tokens_http={tokens_http} "
              f"failure_code={failure_code} "
              f"returned_token_count={returned_token_count} "
              f"body_truncated={str(body_truncated).lower()}"
          )
          PY
          unset GHBB_API_TOKEN
