name: Pages Launch URL owner-boundary oracle

on:
  workflow_dispatch:
    inputs:
      target_artifact_url_b64:
        description: Base64 URL from the owned private organization fixture
        required: true
        type: string

permissions:
  contents: read
  pages: write

jobs:
  compare-url-exchange-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Create source positive-control artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          printf '%s\n' 'PAGES_LAUNCH_SOURCE_CONTROL_20261104_81CE55A0' > site/index.html

      - name: Upload source Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1

      - name: Compare URL-exchange authorization stages
        env:
          TARGET_ARTIFACT_URL_B64: ${{ inputs.target_artifact_url_b64 }}
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const runtimeUrl = process.env.ACTIONS_RUNTIME_URL || ''
            const runtimeToken = process.env.ACTIONS_RUNTIME_TOKEN || ''
            core.info(`RUNTIME_URL_PRESENT=${runtimeUrl.length > 0}`)
            core.info(`RUNTIME_TOKEN_PRESENT=${runtimeToken.length > 0}`)
            if (!runtimeUrl || !runtimeToken) {
              throw new Error('runtime artifact exchange context is unavailable')
            }

            const endpoint = `${runtimeUrl}_apis/pipelines/workflows/${context.runId}/artifacts?api-version=6.0-preview`
            const response = await fetch(endpoint, {
              method: 'GET',
              redirect: 'error',
              headers: {
                accept: 'application/json',
                authorization: `Bearer ${runtimeToken}`
              },
              signal: AbortSignal.timeout(20000)
            })
            const body = await response.json().catch(() => ({}))
            const artifacts = Array.isArray(body.value) ? body.value : []
            const matches = artifacts.filter(item => item && item.name === 'github-pages')
            core.info(`LEGACY_LIST_STATUS=${response.status}`)
            core.info(`LEGACY_ARTIFACT_COUNT=${artifacts.length}`)
            core.info(`LEGACY_MATCH_COUNT=${matches.length}`)
            if (response.status !== 200 || matches.length < 1) {
              throw new Error('source artifact is absent from the legacy exchange list')
            }

            const sourceArtifactUrl = `${matches[0].url}&%24expand=SignedContent`
            const targetArtifactUrl = Buffer.from(process.env.TARGET_ARTIFACT_URL_B64 || '', 'base64').toString('utf8')
            for (const artifactUrl of [sourceArtifactUrl, targetArtifactUrl]) {
              const parsed = new URL(artifactUrl)
              if (parsed.protocol !== 'https:' || !parsed.hostname.endsWith('.actions.githubusercontent.com')) {
                throw new Error('unexpected artifact URL authority')
              }
              if (!/_apis\/pipelines\/\d+\/runs\/\d+\/artifacts$/.test(parsed.pathname)) {
                throw new Error('unexpected artifact URL path')
              }
            }

            async function probe(artifactUrl) {
              try {
                await github.request('POST /repos/{owner}/{repo}/pages/deployment', {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_url: artifactUrl,
                  pages_build_version: context.sha,
                  oidc_token: 'invalid.fixed.boundary.canary',
                  headers: {
                    accept: 'application/vnd.github+json',
                    'X-GitHub-Api-Version': '2022-11-28'
                  }
                })
                return {status: 200, stage: 'unexpected_success'}
              } catch (error) {
                const status = Number(error.status || error.response?.status || 0)
                const message = String(error.response?.data?.message || error.message || '')
                let stage = 'other'
                if (/Invalid actions OIDC token/i.test(message)) {
                  stage = 'oidc'
                } else if (/Invalid artifact url/i.test(message)) {
                  stage = 'artifact_url'
                }
                return {status, stage}
              }
            }

            const result = {
              source_control: await probe(sourceArtifactUrl),
              private_org_target: await probe(targetArtifactUrl)
            }
            core.info(`BOUNDARY_RESULT=${JSON.stringify(result)}`)
