name: Pages static canary

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Artifact mode
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - canary

permissions: {}

concurrency:
  group: pages-static-canary
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Build minimal Pages artifact
        shell: python
        env:
          ARTIFACT_PATH: ${{ runner.temp }}/artifact.tar
          MODE: ${{ inputs.mode }}
          CANARY_DIRECTORY_B64: ${{ secrets.CANARY_DIRECTORY_B64 }}
        run: |
          import base64
          import io
          import os
          import tarfile

          if os.environ["MODE"] == "canary":
              encoded = os.environ["CANARY_DIRECTORY_B64"]
              if not encoded:
                  raise RuntimeError("canary input is not configured")
              directory_name = base64.b64decode(encoded, validate=True).decode("utf-8")
          else:
              directory_name = "site"

          directory = tarfile.TarInfo(directory_name)
          directory.type = tarfile.DIRTYPE
          directory.mode = 0o755

          body = b"GitHub Pages static canary\n"
          page = tarfile.TarInfo(f"{directory_name}/index.html")
          page.mode = 0o644
          page.size = len(body)

          with tarfile.open(os.environ["ARTIFACT_PATH"], "w", format=tarfile.GNU_FORMAT) as archive:
              archive.addfile(directory)
              archive.addfile(page, io.BytesIO(body))

      - name: Upload Pages artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
