name: GSM dumb HTTP Git baseline

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: gsm-dumb-http-git
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Build an inert bare repository and Pages artifact
        shell: bash
        env:
          ARTIFACT_PATH: ${{ runner.temp }}/artifact.tar
          WORK_REPOSITORY: ${{ runner.temp }}/gsm-work
          SITE_ROOT: ${{ runner.temp }}/site
        run: |
          set -euo pipefail

          git init --initial-branch=main "$WORK_REPOSITORY"
          git -C "$WORK_REPOSITORY" config user.name "GSM canary"
          git -C "$WORK_REPOSITORY" config user.email "gsm-canary@example.invalid"
          printf '%s\n' 'GSM_DUMB_HTTP_BASELINE_20260909' > "$WORK_REPOSITORY/marker.txt"
          git -C "$WORK_REPOSITORY" add marker.txt
          git -C "$WORK_REPOSITORY" commit -m 'Add inert GSM parser marker'

          mkdir -p "$SITE_ROOT/site"
          printf '%s\n' 'GitHub Pages GSM dumb HTTP baseline' > "$SITE_ROOT/site/index.html"
          git clone --bare "$WORK_REPOSITORY" "$SITE_ROOT/site/dumb-git"
          git --git-dir="$SITE_ROOT/site/dumb-git" repack -ad
          git --git-dir="$SITE_ROOT/site/dumb-git" update-server-info

          git init --initial-branch=main "$WORK_REPOSITORY-lfs"
          git -C "$WORK_REPOSITORY-lfs" config user.name "GSM canary"
          git -C "$WORK_REPOSITORY-lfs" config user.email "gsm-canary@example.invalid"
          printf '%s\n' '*.bin filter=lfs diff=lfs merge=lfs -text' > "$WORK_REPOSITORY-lfs/.gitattributes"
          cat > "$WORK_REPOSITORY-lfs/.lfsconfig" <<'EOF'
          [lfs]
            url = https://singetu0096.github.io/pages-static-canary-20260909/site/lfs-probe
          EOF
          cat > "$WORK_REPOSITORY-lfs/probe.bin" <<'EOF'
          version https://git-lfs.github.com/spec/v1
          oid sha256:efd28e97fbe142528b8dc64764645f76be50721c20d254c36b6badbf47a5a43e
          size 29
          EOF
          printf '%s\n' 'GSM_LFS_DISCOVERY_PROBE_20260909' > "$WORK_REPOSITORY-lfs/marker.txt"
          git -C "$WORK_REPOSITORY-lfs" add .gitattributes .lfsconfig probe.bin marker.txt
          git -C "$WORK_REPOSITORY-lfs" commit -m 'Add inert LFS discovery probe'
          git clone --bare "$WORK_REPOSITORY-lfs" "$SITE_ROOT/site/dumb-lfs-probe"
          git --git-dir="$SITE_ROOT/site/dumb-lfs-probe" repack -ad
          git --git-dir="$SITE_ROOT/site/dumb-lfs-probe" update-server-info

          malformed_repository="$SITE_ROOT/site/dumb-malformed-commit"
          git init --bare "$malformed_repository"
          empty_tree=$(printf '' | git --git-dir="$malformed_repository" hash-object -t tree -w --stdin)
          malformed_commit=$(
            printf 'tree %s\ncommitter GSM canary <gsm-canary@example.invalid> 0 +0000\n\nGSM_MISSING_AUTHOR_PROBE_20260909\n' "$empty_tree" |
              git --git-dir="$malformed_repository" hash-object --literally -t commit -w --stdin
          )
          git --git-dir="$malformed_repository" update-ref refs/heads/main "$malformed_commit"
          git --git-dir="$malformed_repository" symbolic-ref HEAD refs/heads/main
          git --git-dir="$malformed_repository" repack -ad
          git --git-dir="$malformed_repository" update-server-info

          git init --initial-branch=main "$WORK_REPOSITORY-broken-ref"
          git -C "$WORK_REPOSITORY-broken-ref" config user.name "GSM canary"
          git -C "$WORK_REPOSITORY-broken-ref" config user.email "gsm-canary@example.invalid"
          printf '%s\n' 'GSM_BROKEN_REF_BASELINE_20260909' > "$WORK_REPOSITORY-broken-ref/marker.txt"
          git -C "$WORK_REPOSITORY-broken-ref" add marker.txt
          git -C "$WORK_REPOSITORY-broken-ref" commit -m 'Add broken-ref baseline marker'
          git clone --bare "$WORK_REPOSITORY-broken-ref" "$SITE_ROOT/site/dumb-broken-ref"
          broken_blob=$(printf '%s\n' 'GSM_BLOB_AS_BRANCH_20260909' | git --git-dir="$SITE_ROOT/site/dumb-broken-ref" hash-object -t blob -w --stdin)
          git --git-dir="$SITE_ROOT/site/dumb-broken-ref" update-ref refs/heads/broken-blob "$broken_blob"
          git --git-dir="$SITE_ROOT/site/dumb-broken-ref" repack -ad
          git --git-dir="$SITE_ROOT/site/dumb-broken-ref" update-server-info

          tar -C "$SITE_ROOT" -cf "$ARTIFACT_PATH" site

      - name: Upload Pages artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
